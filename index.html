    .animate-pulse-subtle {
      animation: pulse-subtle 3s ease-in-out infinite;

</head>
<body class="bg-[#FEF9E7] text-amber-950 min-h-screen">
  <div id="root"></div>

  <!-- Application Bundle -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // 1. SOUND MANAGER (Web Audio + Slots)
    // ==========================================
    class SoundManager {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
        this.volume = 0.7;
        this.soundSlots = {};
        this.listeners = new Set();
        try {
          const saved = localStorage.getItem('unnimutta_sound_muted');
          if (saved !== null) this.isMuted = saved === 'true';
        } catch(e) {}
      }

      getAudioContext() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
          if (AudioCtxClass) this.ctx = new AudioCtxClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        return this.ctx;
      }

      getMuted() { return this.isMuted; }

      setMuted(muted) {
        this.isMuted = muted;
        try { localStorage.setItem('unnimutta_sound_muted', String(muted)); } catch(e) {}
        this.listeners.forEach(fn => fn(this.isMuted));
      }

      toggleMute() {
        this.setMuted(!this.isMuted);
        if (!this.isMuted) this.play('pop');
        return this.isMuted;
      }

      subscribeMuteChange(fn) {
        this.listeners.add(fn);
        return () => this.listeners.delete(fn);
      }

      registerSoundFile(type, audioUrl) {
        try {
          const audio = new Audio(audioUrl);
          audio.preload = 'auto';
          this.soundSlots[type] = audio;
        } catch(e) {}
      }

      play(type) {
        if (this.isMuted) return;
        const slot = this.soundSlots[type];
        if (slot && slot instanceof HTMLAudioElement) {
          try {
            slot.currentTime = 0;
            slot.volume = this.volume;
            slot.play().catch(() => this.playProcedural(type));
            return;
          } catch(e) {}
        }
        this.playProcedural(type);
      }

      playProcedural(type) {
        const ctx = this.getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (type === 'swing') {
          // Tennis racket whoosh: Bandpass white noise
          const bufferSize = ctx.sampleRate * 0.25;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(400, now);
          filter.frequency.exponentialRampToValueAtTime(1400, now + 0.12);
          filter.frequency.exponentialRampToValueAtTime(300, now + 0.25);
          filter.Q.setValueAtTime(3.0, now);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.6 * this.volume, now + 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start(now);
        } else if (type === 'thwack') {
          // Racket hits egg: punchy tone + click transient
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.exponentialRampToValueAtTime(45, now + 0.14);
          gain.gain.setValueAtTime(0.9 * this.volume, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

          const click = ctx.createOscillator();
          const clickGain = ctx.createGain();
          click.type = 'square';
          click.frequency.setValueAtTime(900, now);
          click.frequency.exponentialRampToValueAtTime(120, now + 0.04);
          clickGain.gain.setValueAtTime(0.5 * this.volume, now);
          clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

          osc.connect(gain);
          gain.connect(ctx.destination);
          click.connect(clickGain);
          clickGain.connect(ctx.destination);
          osc.start(now);
          click.start(now);
          osc.stop(now + 0.18);
          click.stop(now + 0.05);
        } else if (type === 'splat') {
          // Acrylic yolk splatter: wet frequency modulation
          const carrier = ctx.createOscillator();
          const mod = ctx.createOscillator();
          const modGain = ctx.createGain();
          const gain = ctx.createGain();
          carrier.type = 'sine';
          carrier.frequency.setValueAtTime(180, now);
          carrier.frequency.exponentialRampToValueAtTime(60, now + 0.3);
          mod.type = 'sawtooth';
          mod.frequency.setValueAtTime(35, now);
          modGain.gain.setValueAtTime(120, now);
          modGain.gain.exponentialRampToValueAtTime(10, now + 0.25);
          gain.gain.setValueAtTime(0.8 * this.volume, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          mod.connect(modGain);
          modGain.connect(carrier.frequency);
          carrier.connect(gain);
          gain.connect(ctx.destination);
          carrier.start(now);
          mod.start(now);
          carrier.stop(now + 0.36);
          mod.stop(now + 0.36);
        } else if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(900, now + 0.08);
          gain.gain.setValueAtTime(0.4 * this.volume, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        } else if (type === 'eggHover') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.linearRampToValueAtTime(320, now + 0.08);
          osc.frequency.linearRampToValueAtTime(280, now + 0.16);
          gain.gain.setValueAtTime(0.25 * this.volume, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'hover') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(900, now);
          gain.gain.setValueAtTime(0.08 * this.volume, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.03);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.035);
        }
      }
    }

    const soundManager = new SoundManager();

    // ==========================================
    // 2. REUSABLE CHICK MASCOT COMPONENT
    // ==========================================
    const ChickMascot = ({
      expression = 'serious',
      pose = 'idle',
      size = 'md',
      className = '',
      showShadow = true,
      interactive = false,
      speechBubble,
      onClick,
      racketAngle = 0,
    }) => {
      const sizeMap = { xs: 36, sm: 56, md: 96, lg: 140, xl: 200, hero: 280 };
      const pixelSize = typeof size === 'number' ? size : sizeMap[size] || 96;

      const renderEyebrows = (expr) => {
        switch (expr) {
          case 'serious':
            return (
              <g stroke="#78350F" strokeWidth="3" strokeLinecap="round">
                <path d="M 40 50 L 52 57" />
                <path d="M 80 50 L 68 57" />
              </g>
            );
          case 'determined':
            return (
              <g stroke="#78350F" strokeWidth="3.5" strokeLinecap="round">
                <path d="M 38 52 L 53 60" />
                <path d="M 82 52 L 67 60" />
              </g>
            );
          case 'squint':
            return (
              <g stroke="#78350F" strokeWidth="2.5" strokeLinecap="round">
                <path d="M 40 54 L 52 56" />
                <path d="M 80 54 L 68 56" />
              </g>
            );
          case 'shocked':
            return (
              <g stroke="#78350F" strokeWidth="2.5" strokeLinecap="round" fill="none">
                <path d="M 38 42 Q 46 38 52 42" />
                <path d="M 68 42 Q 74 38 82 42" />
              </g>
            );
          case 'celebrating':
            return (
              <g stroke="#78350F" strokeWidth="2.5" strokeLinecap="round" fill="none">
                <path d="M 40 46 Q 46 42 52 46" />
                <path d="M 68 46 Q 74 42 80 46" />
              </g>
            );
          default:
            return (
              <g stroke="#78350F" strokeWidth="2" strokeLinecap="round">
                <path d="M 42 50 L 51 52" />
                <path d="M 78 50 L 69 52" />
              </g>
            );
        }
      };

      const renderEyes = (expr) => {
        if (expr === 'squint') {
          return (
            <g stroke="#1F2937" strokeWidth="3" strokeLinecap="round" fill="none">
              <path d="M 42 63 Q 47 61 52 64" />
              <path d="M 68 64 Q 73 61 78 63" />
            </g>
          );
        }
        if (expr === 'shocked') {
          return (
            <g>
              <ellipse cx="46" cy="62" rx="6.5" ry="8" fill="#1F2937" />
              <ellipse cx="74" cy="62" rx="6.5" ry="8" fill="#1F2937" />
              <circle cx="44.5" cy="59.5" r="2.5" fill="#FFFFFF" />
              <circle cx="72.5" cy="59.5" r="2.5" fill="#FFFFFF" />
            </g>
          );
        }
        if (expr === 'celebrating') {
          return (
            <g stroke="#1F2937" strokeWidth="3" strokeLinecap="round" fill="none">
              <path d="M 40 64 Q 46 58 52 64" />
              <path d="M 68 64 Q 74 58 80 64" />
            </g>
          );
        }
        return (
          <g>
            <ellipse cx="46" cy="63" rx="5" ry="6" fill="#1F2937" />
            <ellipse cx="74" cy="63" rx="5" ry="6" fill="#1F2937" />
            <circle cx="44.5" cy="61" r="1.8" fill="#FFFFFF" />
            <circle cx="72.5" cy="61" r="1.8" fill="#FFFFFF" />
            <circle cx="47.5" cy="64.5" r="0.8" fill="#FDE047" />
            <circle cx="75.5" cy="64.5" r="0.8" fill="#FDE047" />
          </g>
        );
      };

      const renderBeak = (expr) => {
        if (expr === 'shocked') {
          return (
            <g>
              <ellipse cx="60" cy="73" rx="6" ry="6" fill="#EA580C" />
              <ellipse cx="60" cy="73.5" rx="4" ry="4" fill="#7C2D12" />
            </g>
          );
        }
        return (
          <g>
            <polygon points="53,69 67,69 60,78" fill="#F97316" stroke="#EA580C" strokeWidth="1" />
            <line x1="56" y1="71" x2="64" y2="71" stroke="#FFEDD5" strokeWidth="1" strokeLinecap="round" />
            <polygon points="55,75 65,75 60,79" fill="#EA580C" opacity="0.8" />
          </g>
        );
      };

      const renderPoseAccessories = (p) => {
        if (p === 'holding-racket' || p === 'swing') {
          const angle = p === 'swing' ? -45 : racketAngle || 25;
          return (
            <g transform={`rotate(${angle}, 95, 75)`}>
              <rect x="91" y="70" width="7" height="36" rx="2" fill="#9A3412" stroke="#431407" strokeWidth="1" />
              <rect x="92" y="74" width="5" height="4" fill="#FED7AA" />
              <rect x="92" y="84" width="5" height="4" fill="#FED7AA" />
              <rect x="92" y="94" width="5" height="4" fill="#FED7AA" />
              <path d="M 91 70 L 87 54 L 102 54 L 98 70 Z" fill="#DC2626" stroke="#991B1B" strokeWidth="1" />
              <ellipse cx="94.5" cy="36" rx="22" ry="26" fill="none" stroke="#DC2626" strokeWidth="4" />
              <ellipse cx="94.5" cy="36" rx="20" ry="24" fill="#FEF3C7" fillOpacity="0.15" stroke="#B91C1C" strokeWidth="1" />
              <g stroke="#94A3B8" strokeWidth="0.8" opacity="0.65">
                <line x1="84" y1="14" x2="84" y2="58" />
                <line x1="89" y1="11" x2="89" y2="61" />
                <line x1="94.5" y1="10" x2="94.5" y2="62" />
                <line x1="100" y1="11" x2="100" y2="61" />
                <line x1="105" y1="14" x2="105" y2="58" />
                <line x1="75" y1="26" x2="114" y2="26" />
                <line x1="73" y1="33" x2="116" y2="33" />
                <line x1="73" y1="40" x2="116" y2="40" />
                <line x1="75" y1="47" x2="114" y2="47" />
              </g>
            </g>
          );
        }
        if (p === 'clipboard') {
          return (
            <g transform="translate(14, 52) rotate(-10)">
              <rect x="0" y="0" width="22" height="32" rx="3" fill="#B45309" stroke="#78350F" strokeWidth="1" />
              <rect x="6" y="-3" width="10" height="5" rx="1.5" fill="#94A3B8" />
              <rect x="3" y="5" width="16" height="23" rx="1" fill="#FEF9C3" />
              <line x1="5" y1="9" x2="17" y2="9" stroke="#334155" strokeWidth="1" />
              <line x1="5" y1="14" x2="15" y2="14" stroke="#334155" strokeWidth="1" />
              <line x1="5" y1="19" x2="16" y2="19" stroke="#DC2626" strokeWidth="1" />
            </g>
          );
        }
        if (p === 'measuring') {
          return (
            <g transform="translate(14, 56) rotate(-15)">
              <rect x="0" y="0" width="30" height="8" rx="1.5" fill="#E2E8F0" stroke="#475569" strokeWidth="1" />
              <line x1="4" y1="0" x2="4" y2="4" stroke="#0F172A" strokeWidth="0.8" />
              <line x1="8" y1="0" x2="8" y2="6" stroke="#0F172A" strokeWidth="0.8" />
              <line x1="12" y1="0" x2="12" y2="4" stroke="#0F172A" strokeWidth="0.8" />
              <line x1="16" y1="0" x2="16" y2="6" stroke="#0F172A" strokeWidth="0.8" />
              <line x1="20" y1="0" x2="20" y2="4" stroke="#0F172A" strokeWidth="0.8" />
              <line x1="24" y1="0" x2="24" y2="6" stroke="#0F172A" strokeWidth="0.8" />
            </g>
          );
        }
        return null;
      };

      return (
        <div
          className={`relative inline-flex flex-col items-center select-none ${interactive ? 'cursor-pointer group transition-transform duration-200 hover:scale-105 active:scale-95' : ''} ${className}`}
          onClick={onClick}
          style={{ width: pixelSize, height: pixelSize }}
        >
          {speechBubble && (
            <div className="absolute -top-14 z-30 bg-amber-950 text-amber-50 text-[11px] font-semibold px-3 py-1.5 rounded-xl shadow-xl whitespace-nowrap border border-amber-700 animate-pulse-subtle">
              {speechBubble}
              <div className="absolute bottom-[-5px] left-1/2 -translate-x-1/2 w-0 h-0 border-x-[5px] border-x-transparent border-t-[6px] border-t-amber-950" />
            </div>
          )}

          <svg viewBox="0 0 120 120" className="w-full h-full overflow-visible drop-shadow-sm" fill="none">
            <defs>
              <linearGradient id="chickBodyGradStandalone" x1="60" y1="20" x2="60" y2="105" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stopColor="#FEF08A" />
                <stop offset="60%" stopColor="#FACC15" />
                <stop offset="100%" stopColor="#EAB308" />
              </linearGradient>
              <linearGradient id="chickBellyGradStandalone" x1="60" y1="65" x2="60" y2="102" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stopColor="#FFFBEB" />
                <stop offset="100%" stopColor="#FEF3C7" />
              </linearGradient>
            </defs>

            {showShadow && <ellipse cx="60" cy="110" rx="36" ry="7" fill="#78350F" fillOpacity="0.12" />}

            {/* Feet */}
            <g>
              <path d="M 44 98 L 38 108 M 44 98 L 44 109 M 44 98 L 50 108" stroke="#EA580C" strokeWidth="2.8" strokeLinecap="round" />
              <path d="M 76 98 L 70 108 M 76 98 L 76 109 M 76 98 L 82 108" stroke="#EA580C" strokeWidth="2.8" strokeLinecap="round" />
            </g>

            {pose === 'swing' && renderPoseAccessories(pose)}

            {/* Left Wing */}
            <path d="M 28 66 C 18 72 16 84 28 88 C 34 86 36 78 35 68 Z" fill="#FACC15" stroke="#CA8A04" strokeWidth="1.5" />

            {/* Body */}
            <path d="M 60 22 C 34 22 24 50 24 75 C 24 94 40 104 60 104 C 80 104 96 94 96 75 C 96 50 86 22 60 22 Z" fill="url(#chickBodyGradStandalone)" stroke="#CA8A04" strokeWidth="1.5" />

            {/* Belly */}
            <path d="M 60 62 C 45 62 38 76 38 88 C 38 98 48 103 60 103 C 72 103 82 98 82 88 C 82 76 75 62 60 62 Z" fill="url(#chickBellyGradStandalone)" opacity="0.85" />

            {/* Head Feather Cowlick */}
            <path d="M 60 22 C 60 14 54 8 52 7 C 56 12 58 16 60 22 Z" fill="#EAB308" />
            <path d="M 60 22 C 62 12 68 7 70 6 C 66 12 64 16 60 22 Z" fill="#CA8A04" />

            {/* Cheek Tufts */}
            <path d="M 23 68 C 18 70 20 75 25 76" stroke="#CA8A04" strokeWidth="1.2" strokeLinecap="round" />
            <path d="M 97 68 C 102 70 100 75 95 76" stroke="#CA8A04" strokeWidth="1.2" strokeLinecap="round" />

            {/* Cheeks */}
            <circle cx="36" cy="71" r="6" fill="#F87171" fillOpacity="0.4" />
            <circle cx="84" cy="71" r="6" fill="#F87171" fillOpacity="0.4" />

            {renderEyebrows(expression)}
            {renderEyes(expression)}
            {renderBeak(expression)}

            {expression === 'serious' && (
              <g opacity="0.85">
                <circle cx="46" cy="63" r="8.5" fill="none" stroke="#D97706" strokeWidth="1.4" />
                <path d="M 37.5 63 L 32 66" stroke="#D97706" strokeWidth="1" />
                <path d="M 42 58 A 6 6 0 0 1 48 58" stroke="#FFFFFF" strokeWidth="1" strokeLinecap="round" fill="none" />
              </g>
            )}

            {/* Right Wing */}
            <path d="M 92 66 C 102 72 104 84 92 88 C 86 86 84 78 85 68 Z" fill="#FACC15" stroke="#CA8A04" strokeWidth="1.5" />

            {pose !== 'swing' && renderPoseAccessories(pose)}
          </svg>
        </div>
      );
    };

    // ==========================================
    // 3. MICRO-TOOLTIP COMPONENT
    // ==========================================
    const MicroTooltip = ({ children, content, position = 'top', soundType = 'hover', className = '' }) => {
      const [isVisible, setIsVisible] = useState(false);

      const handleMouseEnter = () => {
        setIsVisible(true);
        soundManager.play(soundType === 'eggHover' ? 'eggHover' : 'hover');
      };

      const handleMouseLeave = () => setIsVisible(false);

      const posMap = {
        top: 'bottom-full left-1/2 -translate-x-1/2 mb-2',
        bottom: 'top-full left-1/2 -translate-x-1/2 mt-2',
      };

      return (
        <div className={`relative inline-block ${className}`} onMouseEnter={handleMouseEnter} onMouseLeave={handleMouseLeave}>
          {children}
          {isVisible && (
            <div className={`absolute z-30 pointer-events-none transition-all duration-200 transform scale-100 ${posMap[position] || posMap.top}`}>
              <div className="relative bg-amber-950/95 backdrop-blur-sm text-amber-100 text-[11px] font-medium tracking-wide px-3 py-1.5 rounded-lg shadow-xl border border-amber-800/80 whitespace-nowrap flex items-center gap-1.5">
                <span className="text-amber-400">💡</span>
                <span>{content}</span>
                <div className="absolute top-full left-1/2 -translate-x-1/2 border-solid border-t-amber-950 border-t-4 border-x-transparent border-x-4 border-b-0" />
              </div>
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // 4. SOUND TOGGLE COMPONENT
    // ==========================================
    const SoundToggle = ({ variant = 'pill', className = '' }) => {
      const [isMuted, setIsMuted] = useState(soundManager.getMuted());

      useEffect(() => {
        return soundManager.subscribeMuteChange(muted => setIsMuted(muted));
      }, []);

      const handleToggle = () => soundManager.toggleMute();

      if (variant === 'icon') {
        return (
          <button
            onClick={handleToggle}
            className={`w-9 h-9 rounded-full flex items-center justify-center bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-300 transition-all transform hover:scale-105 active:scale-95 ${className}`}
            title={isMuted ? 'Sound OFF - Click to enable sound' : 'Sound ON - Click to mute'}
          >
            <span>{isMuted ? '🔇' : '🔊'}</span>
          </button>
        );
      }

      return (
        <button
          onClick={handleToggle}
          className={`inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold tracking-wide transition-all border transform hover:scale-105 active:scale-95 ${

    // --- Coin Reference Component ---
    const CoinReference = ({ coin, scale, pan, isActive, onUpdate, onSelect }) => {
      const isDraggingRef = useRef(false);
      const dragStartRef = useRef({ x: 0, y: 0, coinX: 0, coinY: 0 });
      const isResizingRef = useRef(false);
      const resizeStartRef = useRef({ x: 0, y: 0, startDiameter: 0 });

      const screenX = pan.x + coin.x * scale;
      const screenY = pan.y + coin.y * scale;
      const screenDiameter = Math.max(24, coin.diameterPx * scale);
      const radius = screenDiameter / 2;

      const handlePointerDown = (e) => {
        e.stopPropagation();
        onSelect();
        isDraggingRef.current = true;
        dragStartRef.current = { x: e.clientX, y: e.clientY, coinX: coin.x, coinY: coin.y };
        e.target.setPointerCapture?.(e.pointerId);
      };

      const handlePointerMove = (e) => {
        if (isDraggingRef.current) {
          e.stopPropagation();
          const dx = (e.clientX - dragStartRef.current.x) / scale;
          const dy = (e.clientY - dragStartRef.current.y) / scale;
          onUpdate({ x: dragStartRef.current.coinX + dx, y: dragStartRef.current.coinY + dy });
        } else if (isResizingRef.current) {
          e.stopPropagation();
          const dx = e.clientX - resizeStartRef.current.x;
          const dy = e.clientY - resizeStartRef.current.y;
          const distDelta = Math.sqrt(dx * dx + dy * dy) * (dx > 0 || dy > 0 ? 1 : -1);
          const newDiameter = Math.max(30, Math.min(600, resizeStartRef.current.startDiameter + distDelta / scale));
          onUpdate({ diameterPx: Math.round(newDiameter) });
        }
      };

      const handlePointerUp = (e) => {
        if (isDraggingRef.current || isResizingRef.current) {
          e.stopPropagation();
          isDraggingRef.current = false;
          isResizingRef.current = false;
          try { e.target.releasePointerCapture?.(e.pointerId); } catch(err) {}
        }
      };

      const handleResizeStart = (e) => {
        e.stopPropagation();
        isResizingRef.current = true;
        resizeStartRef.current = { x: e.clientX, y: e.clientY, startDiameter: coin.diameterPx };
        e.target.setPointerCapture?.(e.pointerId);
      };

      return (
        <div
          className="absolute select-none group touch-none"
          style={{
            left: `${screenX - radius}px`,
            top: `${screenY - radius}px`,
            width: `${screenDiameter}px`,
            height: `${screenDiameter}px`,
            zIndex: isActive ? 25 : 20,
          }}
          onPointerDown={handlePointerDown}
          onPointerMove={handlePointerMove}
          onPointerUp={handlePointerUp}
          onPointerCancel={handlePointerUp}
        >
          <div
            className={`absolute inset-0 rounded-full transition-all duration-200 pointer-events-none ${
              isActive
                ? 'ring-4 ring-amber-400 ring-offset-2 ring-offset-amber-900/20 shadow-lg shadow-amber-500/40'

            }`}
          />
          <svg viewBox="0 0 100 100" className="w-full h-full cursor-grab active:cursor-grabbing drop-shadow-md">
            <defs>
              <radialGradient id="brassRingLive" cx="40%" cy="40%" r="60%">
                <stop offset="0%" stopColor="#FDE68A" />
                <stop offset="60%" stopColor="#D97706" />
                <stop offset="100%" stopColor="#92400E" />
              </radialGradient>
              <radialGradient id="nickelCoreLive" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stopColor="#FFFFFF" />
                <stop offset="45%" stopColor="#E2E8F0" />
                <stop offset="85%" stopColor="#94A3B8" />
                <stop offset="100%" stopColor="#64748B" />
              </radialGradient>
            </defs>
            <circle cx="50" cy="50" r="48" fill="url(#brassRingLive)" stroke="#78350F" strokeWidth="1.5" />
            {[...Array(10)].map((_, i) => {
              const angle = (i * 36 * Math.PI) / 180;
              return (
                <line
                  key={i}
                  x1={50 + 44 * Math.cos(angle)}
                  y1={50 + 44 * Math.sin(angle)}
                  x2={50 + 39 * Math.cos(angle)}
                  y2={50 + 39 * Math.sin(angle)}
                  stroke="#B45309"
                  strokeWidth="2"
                  strokeLinecap="round"
                />
              );
            })}
            <circle cx="50" cy="50" r="32" fill="url(#nickelCoreLive)" stroke="#B45309" strokeWidth="1.5" />
            <circle cx="50" cy="50" r="30.5" fill="none" stroke="#CBD5E1" strokeWidth="0.8" strokeDasharray="1 2" />
            <text x="50" y="42" textAnchor="middle" fill="#1E293B" fontSize="17" fontWeight="900" fontFamily="system-ui, sans-serif">

            className={`absolute left-1/2 -bottom-7 transform -translate-x-1/2 whitespace-nowrap px-2 py-0.5 rounded-full text-[10px] font-mono font-bold transition-all pointer-events-none ${
              isActive ? 'bg-amber-950 text-amber-300 ring-1 ring-amber-400' : 'bg-amber-900/80 text-amber-100'
            }`}
          >
            ₹10 Ref: {coin.diameterPx}px (27.0mm)
          </div>
        </div>
      );
    };

    // --- Yolk Caliper Component ---
    const YolkCaliper = ({ yolk, scale, pan, isActive, mmPerPixel, onUpdate, onSelect }) => {
      const isDraggingRef = useRef(false);
      const dragStartRef = useRef({ x: 0, y: 0, yolkX: 0, yolkY: 0 });
      const isResizingRef = useRef(false);
      const resizeStartRef = useRef({ x: 0, y: 0, startRadius: 0 });

      const screenX = pan.x + yolk.x * scale;
      const screenY = pan.y + yolk.y * scale;
      const screenRadius = Math.max(12, yolk.radius * scale);
      const screenDiameter = screenRadius * 2;
      const diameterMm = (yolk.radius * 2 * mmPerPixel).toFixed(1);

      const isYolk1 = yolk.id === 'yolk1';
      const primaryColor = isYolk1 ? '#F59E0B' : '#EA580C';
      const bgBadgeColor = isYolk1 ? 'bg-amber-500' : 'bg-orange-600';

      const handlePointerDown = (e) => {
        e.stopPropagation();
        onSelect();
        isDraggingRef.current = true;
        dragStartRef.current = { x: e.clientX, y: e.clientY, yolkX: yolk.x, yolkY: yolk.y };
        e.target.setPointerCapture?.(e.pointerId);
      };

      const handlePointerMove = (e) => {
        if (isDraggingRef.current) {
          e.stopPropagation();
          const dx = (e.clientX - dragStartRef.current.x) / scale;
          const dy = (e.clientY - dragStartRef.current.y) / scale;
          onUpdate({ x: dragStartRef.current.yolkX + dx, y: dragStartRef.current.yolkY + dy });
        } else if (isResizingRef.current) {
          e.stopPropagation();
          const dx = e.clientX - resizeStartRef.current.x;
          const dy = e.clientY - resizeStartRef.current.y;
          const delta = Math.sqrt(dx * dx + dy * dy) * (dx > 0 || dy > 0 ? 1 : -1);
          const newRadius = Math.max(10, Math.min(400, resizeStartRef.current.startRadius + delta / scale));
          onUpdate({ radius: Math.round(newRadius) });
        }
      };

      const handlePointerUp = (e) => {
        if (isDraggingRef.current || isResizingRef.current) {
          e.stopPropagation();
          isDraggingRef.current = false;
          isResizingRef.current = false;
          try { e.target.releasePointerCapture?.(e.pointerId); } catch(err) {}
        }
      };

      const handleResizeStart = (e) => {
        e.stopPropagation();
        onSelect();
        isResizingRef.current = true;
        resizeStartRef.current = { x: e.clientX, y: e.clientY, startRadius: yolk.radius };
        e.target.setPointerCapture?.(e.pointerId);
      };

      return (
        <div
          className="absolute select-none group touch-none"
          style={{
            left: `${screenX - screenRadius}px`,
            top: `${screenY - screenRadius}px`,
            width: `${screenDiameter}px`,
            height: `${screenDiameter}px`,
            zIndex: isActive ? 24 : 18,
          }}
          onPointerDown={handlePointerDown}
          onPointerMove={handlePointerMove}
          onPointerUp={handlePointerUp}
          onPointerCancel={handlePointerUp}
        >
          <svg viewBox={`0 0 ${screenDiameter} ${screenDiameter}`} className="w-full h-full cursor-move">
            <circle
              cx={screenRadius}
              cy={screenRadius}
              r={screenRadius - 2}
              fill={isActive ? (isYolk1 ? 'rgba(245, 158, 11, 0.18)' : 'rgba(234, 88, 12, 0.18)') : 'rgba(0, 0, 0, 0.04)'}
              stroke={primaryColor}
              strokeWidth={isActive ? 2.5 : 1.5}
              strokeDasharray={isActive ? 'none' : '4 3'}
            />
            {isActive && (
              <circle
                cx={screenRadius}
                cy={screenRadius}
                r={screenRadius + 4}
                fill="none"
                stroke={primaryColor}
                strokeWidth="1.5"
                strokeDasharray="2 4"
                className="animate-pulse"
              />
            )}
            <circle cx={screenRadius} cy={screenRadius} r={3.5} fill={primaryColor} />
            <line x1={screenRadius - 10} y1={screenRadius} x2={screenRadius + 10} y2={screenRadius} stroke={primaryColor} strokeWidth="1.5" />
            <line x1={screenRadius} y1={screenRadius - 10} x2={screenRadius} y2={screenRadius + 10} stroke={primaryColor} strokeWidth="1.5" />
            <line x1={2} y1={screenRadius} x2={screenDiameter - 2} y2={screenRadius} stroke={primaryColor} strokeWidth="1" strokeDasharray="3 3" strokeOpacity="0.7" />
          </svg>

          {isActive && (
            <div
              className="absolute right-0 top-1/2 transform translate-x-1/2 -translate-y-1/2 w-5 h-5 bg-white rounded-full border-2 cursor-ew-resize flex items-center justify-center shadow-lg hover:scale-125 transition-transform"
              style={{ borderColor: primaryColor }}
              title={`Drag to adjust ${yolk.name} boundary`}
              onPointerDown={handleResizeStart}
              onPointerMove={handlePointerMove}
              onPointerUp={handlePointerUp}
            >
              <div className="w-2 h-2 rounded-full" style={{ backgroundColor: primaryColor }} />
            </div>
          )}

          <div
            className={`absolute left-1/2 -top-8 transform -translate-x-1/2 whitespace-nowrap px-2.5 py-0.5 rounded-full text-[11px] font-mono font-bold transition-all pointer-events-none flex items-center gap-1.5 shadow-md ${
              isActive ? `${bgBadgeColor} text-white ring-2 ring-white` : 'bg-amber-950/80 text-amber-200'
            }`}
          >
            <span className="w-1.5 h-1.5 rounded-full bg-white animate-ping" />
            <span>{yolk.name}</span>
            {isActive && <span className="text-[9px] uppercase px-1 py-0.2 bg-black/20 rounded">Active</span>}
          </div>

          <div
            className={`absolute left-1/2 -bottom-7 transform -translate-x-1/2 whitespace-nowrap px-2 py-0.5 rounded-full text-[10px] font-mono font-bold pointer-events-none ${
              isActive ? 'bg-amber-950 text-white border border-amber-400' : 'bg-black/60 text-white/90'
            }`}
          >
            Ø {yolk.radius * 2}px ({diameterMm} mm)
          </div>
        </div>
      );
    };

    // --- Measurement Workspace Component ---
    const MeasurementWorkspace = ({
      imageSrc,
      imageDimensions,
      coin,
      yolks,
      activeYolkId,
      activeItem,
      onUpdateCoin,
      onUpdateYolk,
      onSelectYolk,
      onSelectCoin,
      onSelectWorkspace,
    }) => {
      const containerRef = useRef(null);
      const [scale, setScale] = useState(1.0);
      const [pan, setPan] = useState({ x: 0, y: 0 });
      const isPanningRef = useRef(false);
      const panStartRef = useRef({ x: 0, y: 0, initialPanX: 0, initialPanY: 0 });

      const mmPerPixel = 27.0 / (coin.diameterPx || 100);

      useEffect(() => {
        if (containerRef.current && imageDimensions) {
          const containerW = containerRef.current.clientWidth;
          const containerH = containerRef.current.clientHeight;
          const initialScale = Math.min(
            1.0,
            (containerW * 0.85) / imageDimensions.width,
            (containerH * 0.85) / imageDimensions.height
          );
          setScale(Number(initialScale.toFixed(2)) || 1.0);
          setPan({
            x: (containerW - imageDimensions.width * initialScale) / 2,
            y: (containerH - imageDimensions.height * initialScale) / 2,
          });
        }
      }, [imageDimensions]);

      const handleZoomIn = () => setScale((prev) => Math.min(4.0, Number((prev + 0.15).toFixed(2))));
      const handleZoomOut = () => setScale((prev) => Math.max(0.2, Number((prev - 0.15).toFixed(2))));
      const handleResetZoom = () => {
        if (containerRef.current && imageDimensions) {
          const containerW = containerRef.current.clientWidth;
          const containerH = containerRef.current.clientHeight;
          const initialScale = Math.min(
            1.0,
            (containerW * 0.85) / imageDimensions.width,
            (containerH * 0.85) / imageDimensions.height
          );
          setScale(Number(initialScale.toFixed(2)) || 1.0);
          setPan({
            x: (containerW - imageDimensions.width * initialScale) / 2,
            y: (containerH - imageDimensions.height * initialScale) / 2,
          });
        } else {
          setScale(1.0);
          setPan({ x: 0, y: 0 });
        }
      };

      const handleWheel = (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
        setScale((prev) => Math.max(0.2, Math.min(4.0, Number((prev * zoomFactor).toFixed(2)))));
      };

      const handlePointerDown = (e) => {
        if (e.target.closest('[data-interactive="true"]')) return;
        onSelectWorkspace();
        isPanningRef.current = true;
        panStartRef.current = { x: e.clientX, y: e.clientY, initialPanX: pan.x, initialPanY: pan.y };
        e.currentTarget.setPointerCapture?.(e.pointerId);
      };

      const handlePointerMove = (e) => {
        if (isPanningRef.current) {
          const dx = e.clientX - panStartRef.current.x;
          const dy = e.clientY - panStartRef.current.y;
          setPan({ x: panStartRef.current.initialPanX + dx, y: panStartRef.current.initialPanY + dy });
        }
      };

      const handlePointerUp = (e) => {
        if (isPanningRef.current) {
          isPanningRef.current = false;
          try { e.currentTarget.releasePointerCapture?.(e.pointerId); } catch(err) {}
        }
      };

      return (
        <div className="relative w-full h-[520px] sm:h-[600px] rounded-3xl overflow-hidden border-2 border-amber-300/80 bg-[#1C1917] shadow-xl select-none">
          <div
            className="absolute inset-0 pointer-events-none opacity-25"
            style={{
              backgroundImage: 'linear-gradient(to right, #44403C 1px, transparent 1px), linear-gradient(to bottom, #44403C 1px, transparent 1px)',
              backgroundSize: '20px 20px',
            }}
          />

          <div className="absolute top-4 right-4 z-30 flex items-center gap-1.5 bg-amber-950/90 backdrop-blur-md px-3 py-1.5 rounded-2xl border border-amber-400/40 shadow-lg text-white">
            <span className="text-[11px] font-mono font-bold text-amber-300 pr-1">{Math.round(scale * 100)}%</span>
            <button onClick={handleZoomIn} className="w-8 h-8 rounded-xl bg-amber-500/20 hover:bg-amber-400 hover:text-amber-950 flex items-center justify-center text-base font-bold transition-all" title="Zoom In (+)">+</button>
            <button onClick={handleZoomOut} className="w-8 h-8 rounded-xl bg-amber-500/20 hover:bg-amber-400 hover:text-amber-950 flex items-center justify-center text-base font-bold transition-all" title="Zoom Out (−)">−</button>
            <button onClick={handleResetZoom} className="px-2.5 h-8 rounded-xl bg-amber-500/20 hover:bg-amber-400 hover:text-amber-950 text-xs font-semibold flex items-center gap-1 transition-all" title="Reset Zoom View">
              <span>↺</span>
              <span className="hidden sm:inline">Reset</span>
            </button>
          </div>

          <div className="absolute top-4 left-4 z-30 flex items-center gap-2 bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-2xl border border-white/10 text-white text-xs font-mono">
            <div className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
            <span className="text-white/80">Active Tool:</span>
            <span className="font-bold text-amber-300 uppercase">
              {activeItem === 'coin' ? '🪙 ₹10 Coin Ref' : activeItem === 'yolk1' ? '🥚 Yolk 1 (Alpha)' : activeItem === 'yolk2' ? '🥚 Yolk 2 (Beta)' : '✋ Pan Workspace'}
            </span>
          </div>

          <div
            ref={containerRef}
            className="w-full h-full cursor-grab active:cursor-grabbing overflow-hidden relative"
            onWheel={handleWheel}
            onPointerDown={handlePointerDown}
            onPointerMove={handlePointerMove}
            onPointerUp={handlePointerUp}
            onPointerCancel={handlePointerUp}
          >
            {imageSrc ? (
              <>
                <div
                  className="absolute pointer-events-none transition-transform origin-top-left"
                  style={{
                    transform: `translate(${pan.x}px, ${pan.y}px) scale(${scale})`,
                    width: imageDimensions ? `${imageDimensions.width}px` : 'auto',
                    height: imageDimensions ? `${imageDimensions.height}px` : 'auto',
                  }}
                >
                  <img
                    src={imageSrc}
                    alt="Specimen"
                    className="max-w-none shadow-2xl rounded-lg border border-amber-500/20"
                    style={{
                      width: imageDimensions ? `${imageDimensions.width}px` : 'auto',
                      height: imageDimensions ? `${imageDimensions.height}px` : 'auto',
                      objectFit: 'contain',
                    }}
                  />
                </div>

                <div data-interactive="true">
                  <CoinReference
                    coin={coin}
                    scale={scale}
                    pan={pan}
                    isActive={activeItem === 'coin'}
                    onUpdate={onUpdateCoin}
                    onSelect={onSelectCoin}
                  />
                </div>

                <div data-interactive="true">
                  <YolkCaliper
                    yolk={yolks.yolk1}
                    scale={scale}
                    pan={pan}
                    isActive={activeItem === 'yolk1' || activeYolkId === 'yolk1'}
                    mmPerPixel={mmPerPixel}
                    onUpdate={(upd) => onUpdateYolk('yolk1', upd)}
                    onSelect={() => onSelectYolk('yolk1')}
                  />
                </div>

                <div data-interactive="true">
                  <YolkCaliper
                    yolk={yolks.yolk2}
                    scale={scale}
                    pan={pan}
                    isActive={activeItem === 'yolk2' || activeYolkId === 'yolk2'}
                    mmPerPixel={mmPerPixel}
                    onUpdate={(upd) => onUpdateYolk('yolk2', upd)}
                    onSelect={() => onSelectYolk('yolk2')}
                  />
                </div>
              </>
            ) : (
              <div className="w-full h-full flex flex-col items-center justify-center text-center p-8 text-amber-200/60 select-none">
                <div className="w-20 h-20 rounded-3xl bg-amber-950/60 border-2 border-dashed border-amber-500/40 flex items-center justify-center text-3xl mb-4 animate-bounce">🥚</div>
                <p className="text-lg font-bold text-amber-100 font-serif">Measurement Bay Empty</p>
                <p className="text-xs text-amber-300/70 max-w-sm mt-1">Upload a cracked egg photograph containing twin yolks above.</p>
              </div>
            )}
          </div>

          <div className="absolute bottom-3 left-4 right-4 pointer-events-none flex items-center justify-between text-[11px] font-mono text-amber-200/80 bg-black/50 backdrop-blur-md px-3 py-1.5 rounded-xl border border-white/10">
            <div className="flex items-center gap-3">
              <span>Scale: 1px = {mmPerPixel.toFixed(3)}mm</span>
              <span className="hidden sm:inline">•</span>
              <span className="hidden sm:inline">Drag image to pan, scroll to zoom</span>
            </div>
            <div className="text-amber-400 font-bold">
              {coin.isCalibratedToImage ? '✓ Calibrated to In-Photo Coin' : '⚠ Relative Virtual Reference'}
            </div>
          </div>
        </div>
      );
    };

    // --- Comparison Panel Component ---
    const ComparisonPanel = ({ yolk1, yolk2, coin, onResetAnalysis }) => {
      const [copied, setCopied] = useState(false);
      const mmPerPx = 27.0 / (coin.diameterPx || 100);

      const d1Px = yolk1.radius * 2;
      const d2Px = yolk2.radius * 2;
      const d1Mm = d1Px * mmPerPx;
      const d2Mm = d2Px * mmPerPx;
      const diffMm = Math.abs(d1Mm - d2Mm);
      const maxD = Math.max(d1Mm, d2Mm);
      const minD = Math.min(d1Mm, d2Mm);
      const symmetryPercent = maxD > 0 ? (minD / maxD) * 100 : 100;

      const r1Cm = (d1Mm / 2) / 10;
      const r2Cm = (d2Mm / 2) / 10;
      const vol1Ml = (4 / 3) * Math.PI * Math.pow(r1Cm, 3);
      const vol2Ml = (4 / 3) * Math.PI * Math.pow(r2Cm, 3);

      const dominantYolk = d1Mm > d2Mm ? 'Yolk 1 (Alpha)' : d2Mm > d1Mm ? 'Yolk 2 (Beta)' : 'Identical Twins';

      let chickSpeech = "Remarkable specimens. Peer review awaits.";
      let chickExpr = 'serious';

      if (symmetryPercent > 95) {
        chickSpeech = `Astonishing symmetry! ${symmetryPercent.toFixed(1)}% twin parity. Rare equilibrium.`;
        chickExpr = 'celebrating';
      } else if (diffMm > 8) {
        chickSpeech = `Unusual disparity! ${dominantYolk} dominates by ${diffMm.toFixed(1)} mm. Fascinating.`;
        chickExpr = 'shocked';
      } else {
        chickSpeech = `Specimens confirmed. Delta of ${diffMm.toFixed(1)} mm within acceptable poultry variances.`;
        chickExpr = 'serious';
      }

      const handleCopyReport = () => {
        const report = [
          `=== UNNIMUTTA LAB REPORT: DOUBLE-YOLK METROLOGY ===`,
          `Date: ${new Date().toLocaleDateString()}`,
          `Reference Standard: Virtual ₹10 Coin (${coin.realDiameterMm} mm = ${coin.diameterPx} px)`,
          `Calibration Status: ${coin.isCalibratedToImage ? 'Physically Calibrated to In-Photo Coin' : 'Relative Virtual Benchmark'}`,
          `----------------------------------------------------`,
          `Yolk 1 (Alpha):  ${d1Mm.toFixed(1)} mm  (${d1Px} px) | Approx Vol: ${vol1Ml.toFixed(1)} mL`,
          `Yolk 2 (Beta):   ${d2Mm.toFixed(1)} mm  (${d2Px} px) | Approx Vol: ${vol2Ml.toFixed(1)} mL`,
          `Diameter Delta:  ${diffMm.toFixed(1)} mm`,
          `Symmetry Index:  ${symmetryPercent.toFixed(1)}%`,
          `Dominant Specimen: ${dominantYolk}`,
          `Verdict: ${chickSpeech}`,
          `====================================================`,
        ].join('\n');

        navigator.clipboard?.writeText(report);
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      };

      return (
        <div className="bg-[#FFFDF7] border-2 border-amber-300 rounded-3xl p-6 sm:p-8 shadow-xl shadow-amber-900/5 space-y-6">
          <div className="flex flex-wrap items-center justify-between gap-4 pb-5 border-b border-amber-200">
            <div>
              <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-100 text-amber-900 border border-amber-300 text-xs font-mono font-bold uppercase tracking-wider mb-2">
                <span>📊</span>
                <span>Step 7 Complete: Dual Yolk Metrology Report</span>
              </div>
              <h3 className="text-2xl font-black text-amber-950 font-serif">Specimen Comparative Analysis</h3>
              <p className="text-xs text-amber-800/80">Computed against the 27.00 mm Reserve Bank of India ₹10 coin standard.</p>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={handleCopyReport}
                className="px-4 py-2 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-950 font-semibold text-xs border border-amber-300 transition-all flex items-center gap-1.5 shadow-xs"
              >
                <span>{copied ? '✓' : '📋'}</span>
                <span>{copied ? 'Copied to Clipboard!' : 'Copy Lab Report'}</span>
              </button>
              <button
                onClick={onResetAnalysis}
                className="px-4 py-2 rounded-xl bg-amber-900 hover:bg-amber-800 text-white font-semibold text-xs transition-all shadow-xs"
              >
                ↺ New Measurement
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-amber-50/80 border-2 border-amber-300/80 rounded-2xl p-4 sm:p-5 relative overflow-hidden">
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full bg-amber-500 shadow-sm" />
                  <span className="font-bold text-amber-950 text-sm font-serif">Yolk 1 (Alpha)</span>
                </div>
                <span className="text-[10px] font-mono font-semibold bg-amber-200 text-amber-900 px-2 py-0.5 rounded-full">
                  Ø {d1Px} px
                </span>
              </div>
              <div className="text-3xl font-black text-amber-950 font-serif">
                {d1Mm.toFixed(1)} <span className="text-base font-normal text-amber-800">mm</span>
              </div>
              <div className="mt-2 text-xs text-amber-800/80 font-mono space-y-1">
                <div>Radius: {(d1Mm / 2).toFixed(1)} mm</div>
                <div>Estimated Vol: ~{vol1Ml.toFixed(2)} mL</div>
              </div>
            </div>

            <div className="bg-orange-50/80 border-2 border-orange-300/80 rounded-2xl p-4 sm:p-5 relative overflow-hidden">
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full bg-orange-600 shadow-sm" />
                  <span className="font-bold text-amber-950 text-sm font-serif">Yolk 2 (Beta)</span>
                </div>
                <span className="text-[10px] font-mono font-semibold bg-orange-200 text-orange-950 px-2 py-0.5 rounded-full">
                  Ø {d2Px} px
                </span>
              </div>
              <div className="text-3xl font-black text-amber-950 font-serif">
                {d2Mm.toFixed(1)} <span className="text-base font-normal text-amber-800">mm</span>
              </div>
              <div className="mt-2 text-xs text-amber-800/80 font-mono space-y-1">
                <div>Radius: {(d2Mm / 2).toFixed(1)} mm</div>
                <div>Estimated Vol: ~{vol2Ml.toFixed(2)} mL</div>
              </div>
            </div>

            <div className="bg-[#FFFDF7] border-2 border-amber-400 rounded-2xl p-4 sm:p-5 flex flex-col justify-between">
              <div>
                <div className="text-xs font-mono font-bold uppercase tracking-wider text-amber-800 mb-1">
                  Symmetry Index
                </div>
                <div className="text-3xl font-black text-amber-950 font-serif">
                  {symmetryPercent.toFixed(1)}%
                </div>
                <div className="text-xs text-amber-900 font-semibold mt-1">
                  Diameter Delta: <span className="font-mono font-bold text-amber-950">{diffMm.toFixed(1)} mm</span>
                </div>
              </div>
              <div className="mt-3 pt-3 border-t border-amber-200 text-xs text-amber-800/90 font-mono">
                Ratio: {(d1Mm / (d2Mm || 1)).toFixed(2)} : 1.00
              </div>
            </div>
          </div>

          <div className="bg-amber-100/70 border border-amber-300 rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row items-center gap-4">
            <div className="flex-shrink-0">
              <ChickMascot size={72} expression={chickExpr} pose="clipboard" showShadow={false} />
            </div>
            <div className="flex-1 text-center sm:text-left">
              <div className="text-xs font-bold font-mono uppercase text-amber-900 tracking-wider">
                Senior Poultry Metrologist Verdict:
              </div>
              <p className="mt-1 text-sm sm:text-base font-serif italic text-amber-950">
                “{chickSpeech}”
              </p>
              <div className="mt-2 text-[11px] text-amber-800/80 font-mono">
                Dominant specimen: <strong className="text-amber-950">{dominantYolk}</strong> • Scale: 1px = {mmPerPx.toFixed(3)} mm
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ========================================================
    // PART 3: VIRTUAL ₹10 COIN & TWIN-YOLK MEASUREMENT MODULES
    // ========================================================

    const RBI_COIN_MM = 27.00;
    const DEFAULT_COIN_BASE_PX = 96;

    // --- 1. Virtual ₹10 Indian Coin Component ---
    const VirtualCoin = ({
      x,
      y,
      diameterPx,
      scale = 1.0,
      pan = { x: 0, y: 0 },
      mmPerPixel = 27.0 / 96,
      isActive = true,
      label = '₹10 Reference Coin',
      onMove,
      onResize,
      onSelect,
      showTransparencyToggle = true,
    }) => {
      const isDraggingRef = useRef(false);
      const dragStartRef = useRef({ x: 0, y: 0, initialCoinX: 0, initialCoinY: 0 });
      const isResizingRef = useRef(false);
      const resizeStartRef = useRef({ x: 0, y: 0, initialDiameter: 0 });

      const screenX = pan.x + x * scale;
      const screenY = pan.y + y * scale;

      const radius = screenDiameter / 2;
      const diameterMm = (diameterPx * mmPerPixel).toFixed(2);

      const handlePointerDown = (e) => {
        if (e.target.closest('[data-no-drag="true"]')) return;
        e.preventDefault();
        e.stopPropagation();
        onSelect?.();

        isDraggingRef.current = true;
        dragStartRef.current = {
          x: e.clientX,
          y: e.clientY,
          initialCoinX: x,
          initialCoinY: y,
        };
        e.currentTarget.setPointerCapture?.(e.pointerId);
      };

      const handlePointerMove = (e) => {
        if (isDraggingRef.current) {
          e.preventDefault();
          e.stopPropagation();
          const dx = (e.clientX - dragStartRef.current.x) / scale;
          const dy = (e.clientY - dragStartRef.current.y) / scale;
          onMove(
            Math.round(dragStartRef.current.initialCoinX + dx),
            Math.round(dragStartRef.current.initialCoinY + dy)
          );
        } else if (isResizingRef.current) {
          e.preventDefault();
          e.stopPropagation();
          const centerScreenX = pan.x + x * scale;
          const centerScreenY = pan.y + y * scale;
          const dx = e.clientX - centerScreenX;
          const dy = e.clientY - centerScreenY;
          const currentRadiusScreen = Math.sqrt(dx * dx + dy * dy);
          const newDiameterPx = Math.max(20, Math.min(600, (currentRadiusScreen * 2) / scale));
          onResize(Math.round(newDiameterPx));
        }
      };

      const handlePointerUp = (e) => {
        if (isDraggingRef.current || isResizingRef.current) {
          e.preventDefault();
          e.stopPropagation();
          isDraggingRef.current = false;
          isResizingRef.current = false;
          try {
            e.currentTarget.releasePointerCapture?.(e.pointerId);
          } catch (err) {}
        }
      };

        e.preventDefault();
        e.stopPropagation();
        onSelect?.();

        isResizingRef.current = true;
        resizeStartRef.current = {
          x: e.clientX,
          y: e.clientY,
          initialDiameter: diameterPx,
        };
        e.currentTarget.setPointerCapture?.(e.pointerId);
      };

            top: `${screenY - radius}px`,
            width: `${screenDiameter}px`,

    const MeasurementTool = ({

      const [canvasScale, setCanvasScale] = useState(1.0);
      const [canvasPan, setCanvasPan] = useState({ x: 0, y: 0 });
      const isCanvasPanningRef = useRef(false);
      const canvasPanStartRef = useRef({ x: 0, y: 0, initialPanX: 0, initialPanY: 0 });

      const mmPerPixel = RBI_COIN_MM / DEFAULT_COIN_BASE_PX;

      const [coin, setCoin] = useState({ x: 340, y: 300, diameterPx: 140 });

      const [yolk1, setYolk1] = useState({
        id: 'yolk1',
        name: 'Yolk 1 (Alpha)',
        x: 340,
        y: 300,
        diameterPx: 140,
        diameterMm: 140 * mmPerPixel,
        locked: false,
      });

      const [yolk2, setYolk2] = useState({
        id: 'yolk2',
        name: 'Yolk 2 (Beta)',
        x: 480,
        y: 295,
        diameterPx: 134,
        diameterMm: 134 * mmPerPixel,
        locked: false,
      });

      const [activeYolkTarget, setActiveYolkTarget] = useState('yolk1');

      useEffect(() => {
        if (containerRef.current && imageDimensions) {
          const containerW = containerRef.current.clientWidth || 800;
          const containerH = containerRef.current.clientHeight || 560;
          const fitScale = Math.min(
            1.0,
            (containerW * 0.9) / imageDimensions.width,
            (containerH * 0.9) / imageDimensions.height
          );
          const safeScale = Number(fitScale.toFixed(2)) || 1.0;
          setCanvasScale(safeScale);
          setCanvasPan({
            x: Math.round((containerW - imageDimensions.width * safeScale) / 2),
            y: Math.round((containerH - imageDimensions.height * safeScale) / 2),
          });
        }
      }, [imageDimensions]);

      const handleCoinMove = (newX, newY) => {
        setCoin((prev) => ({ ...prev, x: newX, y: newY }));
        if (activeYolkTarget === 'yolk1' && !yolk1.locked) {
          setYolk1((prev) => ({ ...prev, x: newX, y: newY }));
        } else if (activeYolkTarget === 'yolk2' && !yolk2.locked) {
          setYolk2((prev) => ({ ...prev, x: newX, y: newY }));
        }
      };

      const handleCoinResize = (newDiameterPx) => {
        const clampedPx = Math.max(20, Math.min(500, newDiameterPx));
        setCoin((prev) => ({ ...prev, diameterPx: clampedPx }));
        const calculatedMm = clampedPx * mmPerPixel;

        if (activeYolkTarget === 'yolk1' && !yolk1.locked) {
          setYolk1((prev) => ({ ...prev, diameterPx: clampedPx, diameterMm: calculatedMm }));
        } else if (activeYolkTarget === 'yolk2' && !yolk2.locked) {
          setYolk2((prev) => ({ ...prev, diameterPx: clampedPx, diameterMm: calculatedMm }));
        }
      };

      const handleZoomInCoin = () => handleCoinResize(coin.diameterPx + 4);
      const handleZoomOutCoin = () => handleCoinResize(coin.diameterPx - 4);

      const handleResetCoin = () => {
        if (activeYolkTarget === 'yolk1') {
          const reset = { x: 340, y: 300, diameterPx: 140 };
          setCoin(reset);
          setYolk1((prev) => ({ ...prev, ...reset, diameterMm: reset.diameterPx * mmPerPixel }));
        } else {
          const reset = { x: 480, y: 295, diameterPx: 134 };
          setCoin(reset);
          setYolk2((prev) => ({ ...prev, ...reset, diameterMm: reset.diameterPx * mmPerPixel }));
        }
        setLastActionMessage(null);
      };

      const handleLockYolk1 = () => {
        const currentMm = coin.diameterPx * mmPerPixel;
        setYolk1({
          id: 'yolk1',
          name: 'Yolk 1 (Alpha)',
          x: coin.x,
          y: coin.y,
          diameterPx: coin.diameterPx,
          diameterMm: currentMm,
          locked: true,
        });
        setLastActionMessage('“The yolk has been documented.”');
        setActiveYolkTarget('yolk2');
        setWorkflowStep('step2_yolk2');
        setCoin({ x: 480, y: 295, diameterPx: yolk2.diameterPx || 134 });
      };

      const handleLockYolk2 = () => {
        const currentMm = coin.diameterPx * mmPerPixel;
        setYolk2({
          id: 'yolk2',
          name: 'Yolk 2 (Beta)',
          x: coin.x,
          y: coin.y,
          diameterPx: coin.diameterPx,
          diameterMm: currentMm,
          locked: true,
        });
        setLastActionMessage('“The yolk has been documented.”');
        setWorkflowStep('step3_compare');
      };

      const handleRestartMeasurement = () => {
        setWorkflowStep('step1_yolk1');
        setActiveYolkTarget('yolk1');
        setLastActionMessage(null);

        const initYolk1 = {
          id: 'yolk1',
          name: 'Yolk 1 (Alpha)',
          x: 340,
          y: 300,
          diameterPx: 140,
          diameterMm: 140 * mmPerPixel,
          locked: false,
        };
        const initYolk2 = {
          id: 'yolk2',
          name: 'Yolk 2 (Beta)',
          x: 480,
          y: 295,
          diameterPx: 134,
          diameterMm: 134 * mmPerPixel,
          locked: false,
        };
        setYolk1(initYolk1);
        setYolk2(initYolk2);
        setCoin({ x: initYolk1.x, y: initYolk1.y, diameterPx: initYolk1.diameterPx });
      };

      const handleSelectYolkToAdjust = (yolkId) => {
        soundManager.play('click');
        setActiveYolkTarget(yolkId);
        if (yolkId === 'yolk1') {
          setWorkflowStep('step1_yolk1');
          setYolk1((prev) => ({ ...prev, locked: false }));
          setCoin({ x: yolk1.x, y: yolk1.y, diameterPx: yolk1.diameterPx });
        } else {
          setWorkflowStep('step2_yolk2');
          setYolk2((prev) => ({ ...prev, locked: false }));
          setCoin({ x: yolk2.x, y: yolk2.y, diameterPx: yolk2.diameterPx });
        }
      };

      const handleCanvasPointerDown = (e) => {
        if (e.target.closest('[data-interactive="true"]')) return;
        isCanvasPanningRef.current = true;
        canvasPanStartRef.current = {
          x: e.clientX,
          y: e.clientY,
          initialPanX: canvasPan.x,
          initialPanY: canvasPan.y,
        };
        e.currentTarget.setPointerCapture?.(e.pointerId);
      };

      const handleCanvasPointerMove = (e) => {
        if (isCanvasPanningRef.current) {
          const dx = e.clientX - canvasPanStartRef.current.x;
          const dy = e.clientY - canvasPanStartRef.current.y;
          setCanvasPan({
            x: canvasPanStartRef.current.initialPanX + dx,
            y: canvasPanStartRef.current.initialPanY + dy,
          });
        }
      };

      const handleCanvasPointerUp = (e) => {
        if (isCanvasPanningRef.current) {
          isCanvasPanningRef.current = false;
          try {
            e.currentTarget.releasePointerCapture?.(e.pointerId);
          } catch (err) {}
        }
      };

      const handleCanvasWheel = (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.08 : 0.92;
        setCanvasScale((prev) => Math.max(0.3, Math.min(3.5, Number((prev * factor).toFixed(2)))));
      };

      const getStepGuidance = () => {
        switch (workflowStep) {
          case 'step1_yolk1':
            return {
              stepNum: 'STEP 1',
              title: 'Measure Yolk 1',
              instruction: 'Place the virtual ₹10 coin over the first yolk and adjust it.',
              expression: 'serious',
              pose: 'measuring',
              chickSpeech: 'Align the virtual ₹10 coin directly over Yolk 1 (Alpha). Expand or shrink until the rim matches the yolk circumference.',
            };
          case 'step2_yolk2':
            return {
              stepNum: 'STEP 2',
              title: 'Measure Yolk 2',
              instruction: 'Move the same virtual coin to the second yolk and adjust it.',
              expression: 'squint',
              pose: 'measuring',
              chickSpeech: 'Yolk 1 is locked! Now drag the same virtual coin over Yolk 2 (Beta) and calibrate its diameter.',
            };
          case 'step3_compare':
            return {
              stepNum: 'STEP 3',
              title: 'Compare',
              instruction: 'See whether the yolks have the same diameter.',
              expression: 'celebrating',
              pose: 'clipboard',
              chickSpeech: 'Measurements finalized! Compare their calibrated diameters and symmetry index below.',
            };
        }
      };

      const guidance = getStepGuidance();
      const currentCoinMm = coin.diameterPx * mmPerPixel;

      return (
        <div className="space-y-6">
          <div className="bg-[#FFFDF7] border-2 border-amber-300 rounded-3xl p-5 sm:p-6 shadow-xl shadow-amber-900/5">

                  <span className="px-3 py-1 rounded-full bg-amber-400 text-amber-950 font-mono font-black text-xs uppercase tracking-wider shadow-xs">
                    {guidance.stepNum} — {guidance.title}
                  </span>
                  <span className="text-[11px] font-mono text-amber-800 bg-amber-100 px-2.5 py-0.5 rounded-full font-bold">

                  </span>
                </div>

                <h3 className="text-xl sm:text-2xl font-black text-amber-950 font-serif">
                  {guidance.instruction}
                </h3>

                <p className="text-xs sm:text-sm text-amber-900/80 font-serif italic">
                  “{guidance.chickSpeech}”
                </p>
              </div>

              <div className="flex sm:flex-col gap-2 flex-shrink-0">
                <div
                  className={`px-3 py-1.5 rounded-xl border text-xs font-mono font-bold flex items-center gap-1.5 ${
                    workflowStep === 'step1_yolk1'
                      ? 'bg-amber-900 text-amber-50 border-amber-950 shadow-xs'
                      : yolk1.locked
                      ? 'bg-emerald-100 text-emerald-900 border-emerald-300'
                      : 'bg-amber-50 text-amber-900 border-amber-200 opacity-60'

                >
                  <span>{yolk1.locked ? '✓' : '1'}</span>
                  <span>Yolk 1</span>
                </div>

                <div
                  className={`px-3 py-1.5 rounded-xl border text-xs font-mono font-bold flex items-center gap-1.5 ${
                    workflowStep === 'step2_yolk2'
                      ? 'bg-amber-900 text-amber-50 border-amber-950 shadow-xs'
                      : yolk2.locked
                      ? 'bg-emerald-100 text-emerald-900 border-emerald-300'
                      : 'bg-amber-50 text-amber-900 border-amber-200 opacity-60'
                  }`}
                >
                  <span>{yolk2.locked ? '✓' : '2'}</span>
                  <span>Yolk 2</span>
                </div>

                <div
                  className={`px-3 py-1.5 rounded-xl border text-xs font-mono font-bold flex items-center gap-1.5 ${
                    workflowStep === 'step3_compare'
                      ? 'bg-amber-900 text-amber-50 border-amber-950 shadow-xs'
                      : 'bg-amber-50 text-amber-900 border-amber-200 opacity-60'
                  }`}
                >
                  <span>3</span>
                  <span>Compare</span>
                </div>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <div className="lg:col-span-8 space-y-3">
              <div className="relative w-full h-[520px] sm:h-[600px] rounded-3xl overflow-hidden border-2 border-amber-300 bg-[#18181B] shadow-2xl select-none touch-none">
                <div
                  className="absolute inset-0 pointer-events-none opacity-20"
                  style={{
                    backgroundImage:
                      'linear-gradient(to right, #52525B 1px, transparent 1px), linear-gradient(to bottom, #52525B 1px, transparent 1px)',
                    backgroundSize: '24px 24px',
                  }}
                />

                <div className="absolute top-4 left-4 z-30 flex items-center gap-2 bg-black/75 backdrop-blur-md px-3.5 py-1.5 rounded-2xl border border-white/15 text-white text-xs font-mono">
                  <span className="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse" />
                  <span className="text-white/80">Active Tool:</span>
                  <span className="font-bold text-amber-300 uppercase">
                    {workflowStep === 'step1_yolk1'
                      ? '🪙 ₹10 Coin → Yolk 1'
                      : workflowStep === 'step2_yolk2'
                      ? '🪙 ₹10 Coin → Yolk 2'
                      : '📊 Comparison Mode'}
                  </span>
                </div>

                <div className="absolute top-4 right-4 z-30 flex items-center gap-2 bg-amber-950/90 backdrop-blur-md px-3 py-1.5 rounded-2xl border border-amber-400/40 text-white shadow-lg">
                  <span className="text-[11px] font-mono font-bold text-amber-300 pr-1">
                    {Math.round(canvasScale * 100)}%
                  </span>
                  <button
                    type="button"
                    onClick={() => setCanvasScale((s) => Math.min(3.5, Number((s + 0.15).toFixed(2))))}
                    className="w-7 h-7 rounded-xl bg-amber-500/20 hover:bg-amber-400 hover:text-amber-950 flex items-center justify-center text-sm font-bold transition-all active:scale-95"
                    title="Zoom In Canvas (+)"
                  >
                    +
                  </button>
                  <button

                    onClick={() => setCanvasScale((s) => Math.max(0.3, Number((s - 0.15).toFixed(2))))}

                    title="Zoom Out Canvas (−)"
                  >
                    −
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      setCanvasScale(1.0);
                      setCanvasPan({ x: 0, y: 0 });

                    className="px-2 h-7 rounded-xl bg-amber-500/20 hover:bg-amber-400 hover:text-amber-950 text-[11px] font-semibold flex items-center transition-all active:scale-95"

                    ↺ Fit

                <div
