                  className="w-full h-full cursor-grab active:cursor-grabbing overflow-hidden relative"
                  onWheel={handleCanvasWheel}
                  onPointerDown={handleCanvasPointerDown}
                  onPointerMove={handleCanvasPointerMove}
                  onPointerUp={handleCanvasPointerUp}
                  onPointerCancel={handleCanvasPointerUp}
                >
                  <div
                    className="absolute pointer-events-none origin-top-left transition-transform duration-75"
                    style={{
                      transform: `translate(${canvasPan.x}px, ${canvasPan.y}px) scale(${canvasScale})`,
                      width: imageDimensions?.width ? `${imageDimensions.width}px` : '800px',
                      height: imageDimensions?.height ? `${imageDimensions.height}px` : '600px',
                    }}
                  >
                    <img
                      src={imageSrc}
                      alt="Uploaded Egg Specimen"
                      className="max-w-none shadow-2xl rounded-xl border border-amber-500/20 pointer-events-none"
                      style={{
                        width: imageDimensions?.width ? `${imageDimensions.width}px` : '800px',
                        height: imageDimensions?.height ? `${imageDimensions.height}px` : '600px',
                        objectFit: 'contain',
                      }}
                    />
                  </div>

                  {yolk1.locked && (
                    <div data-interactive="true">
                      <LockedYolkOverlay
                        yolk={yolk1}
                        scale={canvasScale}
                        pan={canvasPan}
                        onClick={() => handleSelectYolkToAdjust('yolk1')}
                      />
                    </div>
                  )}

                  {yolk2.locked && (
                    <div data-interactive="true">
                      <LockedYolkOverlay
                        yolk={yolk2}
                        scale={canvasScale}
                        pan={canvasPan}
                        onClick={() => handleSelectYolkToAdjust('yolk2')}
                      />
                    </div>
                  )}

                  {workflowStep !== 'step3_compare' && (
                    <div data-interactive="true">
                      <VirtualCoin
                        x={coin.x}
                        y={coin.y}
                        diameterPx={coin.diameterPx}
                        scale={canvasScale}
                        pan={canvasPan}
                        mmPerPixel={mmPerPixel}
                        isActive={true}
                        label={activeYolkTarget === 'yolk1' ? '₹10 Coin → Yolk 1' : '₹10 Coin → Yolk 2'}
                        onMove={handleCoinMove}
                        onResize={handleCoinResize}
                      />
                    </div>
                  )}
                </div>

                <div className="absolute bottom-3 left-4 right-4 pointer-events-none flex items-center justify-between text-[11px] font-mono text-amber-200/90 bg-black/60 backdrop-blur-md px-4 py-2 rounded-2xl border border-white/10">
                  <div className="flex items-center gap-2">
                    <span>Specimen: <strong className="text-white font-medium">{imageName}</strong></span>
                    <span className="hidden sm:inline">•</span>
                    <span className="hidden sm:inline">Reference Scale: 1px = {mmPerPixel.toFixed(3)}mm</span>
                  </div>
                  <div className="text-amber-400 font-bold">
                    Virtual ₹10 Coin (27.00 mm Standard)
                  </div>
                </div>
              </div>

              <div className="flex flex-wrap items-center justify-between text-xs text-amber-900/80 px-3">
                <span>Drag the ₹10 coin directly with your mouse or finger on mobile</span>
                <div className="flex items-center gap-3">
                  <span>Scroll wheel to zoom image</span>
                  <span>•</span>
                  <button
                    type="button"
                    onClick={onUploadNewImage}
                    className="font-bold underline text-amber-950 hover:text-amber-800"
                  >
                    Switch Egg Image
                  </button>
                </div>
              </div>
            </div>

            <div className="lg:col-span-4 space-y-4">
              <YolkMeasurementCards
                currentStep={workflowStep}
                yolk1={yolk1}
                yolk2={yolk2}
                activeYolk={activeYolkTarget}
                onSelectYolk={handleSelectYolkToAdjust}
              />

              <MeasurementControls
                currentStep={workflowStep}
                coinDiameterPx={coin.diameterPx}
                coinDiameterMm={currentCoinMm}
                onZoomIn={handleZoomInCoin}
                onZoomOut={handleZoomOutCoin}
                onReset={handleResetCoin}
                onSliderChange={handleCoinResize}
                onLockYolk1={handleLockYolk1}
                onLockYolk2={handleLockYolk2}
                onRestartMeasurement={handleRestartMeasurement}
                hasLockedYolk1={yolk1.locked}
                hasLockedYolk2={yolk2.locked}
                lastActionMessage={lastActionMessage}
              />
            </div>
          </div>

          {(workflowStep === 'step3_compare' || (yolk1.locked && yolk2.locked)) && (
            <div id="measurement-results" className="pt-2 animate-fadeIn">
              <MeasurementResult
                yolk1={yolk1}
                yolk2={yolk2}
                onRestartMeasurement={handleRestartMeasurement}
                onAdjustYolk={handleSelectYolkToAdjust}
              />
            </div>
          )}
        </div>
      );
    };

    // --- 6. Main Analyzer View Container ---
    const AnalyzerView = () => {
      const [imageSrc, setImageSrc] = useState(SAMPLE_SPECIMENS[0].imageUrl);
      const [imageName, setImageName] = useState(SAMPLE_SPECIMENS[0].name);
      const [imageDimensions, setImageDimensions] = useState({ width: 800, height: 600 });
      const fileInputRef = useRef(null);

      useEffect(() => {
        if (!imageSrc) return;
        const img = new Image();
        img.onload = () => {
          setImageDimensions({ width: img.naturalWidth || 800, height: img.naturalHeight || 600 });
        };
        img.src = imageSrc;
      }, [imageSrc]);

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        if (!['image/jpeg', 'image/png', 'image/jpg'].includes(file.type)) {
          alert('Please upload a valid image in JPG, JPEG, or PNG format.');
          return;
        }

        soundManager.play('pop');
        const reader = new FileReader();
        reader.onload = (event) => {
          const result = event.target?.result;
          setImageSrc(result);
          setImageName(file.name);
        };
        reader.readAsDataURL(file);
      };

      const handleSelectSample = (sample) => {
        soundManager.play('pop');
        setImageSrc(sample.imageUrl);
        setImageName(sample.name);
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
          <div className="bg-[#FFFDF7] border-2 border-amber-200/90 rounded-3xl p-5 sm:p-6 shadow-md shadow-amber-900/5">
            <div className="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-amber-100">
              <div>
                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-100 text-amber-900 border border-amber-300 text-xs font-mono font-bold uppercase tracking-wider mb-2">
                  <span>🔬</span>
                  <span>PART 3: Virtual ₹10 Coin Metrology Station</span>
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                </div>
                <h2 className="text-2xl sm:text-3xl font-extrabold text-amber-950 font-serif">
                  Double Egg Yolk Diameter Measurement
                </h2>
                <p className="text-xs sm:text-sm text-amber-800/80 mt-0.5">
                  Standardized twin yolk measurement with the interactive virtual ₹10 Indian coin reference overlay (27.0 mm).
                </p>
              </div>

              <div className="flex items-center gap-3">
                <input
                  type="file"
                  ref={fileInputRef}
                  onChange={handleFileUpload}
                  accept=".jpg,.jpeg,.png,image/jpeg,image/png"
                  className="hidden"
                />
                <button
                  onClick={() => fileInputRef.current?.click()}
                  className="px-4 py-2.5 rounded-2xl bg-amber-400 hover:bg-amber-300 text-amber-950 font-bold text-xs sm:text-sm border border-amber-500 shadow-sm hover:shadow transition-all flex items-center gap-2 transform hover:-translate-y-0.5 active:translate-y-0"
                >
                  <span>📁</span>
                  <span>Upload My Egg</span>
                </button>
              </div>
            </div>

            <div className="pt-4 flex flex-wrap items-center gap-2">
              <span className="text-xs font-mono font-bold text-amber-900/80 pl-1">
                Certified Specimens:
              </span>
              {SAMPLE_SPECIMENS.map((specimen) => (
                <button
                  key={specimen.id}
                  onClick={() => handleSelectSample(specimen)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all flex items-center gap-1.5 ${
                    imageName === specimen.name
                      ? 'bg-amber-900 text-amber-50 border-amber-950 shadow-xs'
                      : 'bg-amber-50 hover:bg-amber-100 text-amber-900 border-amber-200'
                  }`}
                >
                  <span>🥚</span>
                  <span>{specimen.badge}: {specimen.name}</span>
                </button>
              ))}
            </div>
          </div>

          <MeasurementTool
            imageSrc={imageSrc}
            imageName={imageName}
            imageDimensions={imageDimensions}
            onUploadNewImage={() => fileInputRef.current?.click()}
          />
        </div>
      );
    };

    // ==========================================
    // 9. ROOT APP CONTROLLER
    // ==========================================
    const App = () => {
      const [showIntro, setShowIntro] = useState(true);
      const [activeTab, setActiveTab] = useState('home');
      const [isMuted, setIsMuted] = useState(soundManager.getMuted());

      useEffect(() => {
        return soundManager.subscribeMuteChange(muted => setIsMuted(muted));
      }, []);

      return (
        <div className="min-h-screen bg-[#FEF9E7] text-amber-950 flex flex-col font-sans selection:bg-amber-300 selection:text-amber-950">
          {showIntro && (
            <IntroAnimation
              onComplete={() => setShowIntro(false)}
              isMuted={isMuted}
              onToggleMute={() => soundManager.toggleMute()}
            />
          )}

          <Navbar
            activeTab={activeTab}
            onSelectTab={setActiveTab}
            onReplayIntro={() => setShowIntro(true)}
          />

          <main className="flex-1">
            {activeTab === 'home' ? (
              <HeroSection
                onNavigateAnalyze={() => setActiveTab('analyze')}
                onNavigateLeaderboard={() => setActiveTab('leaderboard')}
              />
            ) : activeTab === 'analyze' ? (
              <AnalyzerView />
            ) : (
              <PlaceholderView
                tab={activeTab}
                onBackToHome={() => setActiveTab('home')}
              />
            )}
          </main>

          <footer className="border-t border-amber-200/80 bg-[#FEF9E7] py-8 text-center text-xs text-amber-900/70">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-2">
              <div className="flex flex-wrap items-center justify-center gap-4 text-xs font-semibold text-amber-900">
                <button onClick={() => setActiveTab('home')} className="hover:text-amber-950 hover:underline">Home</button>
                <span>•</span>
                <button onClick={() => setActiveTab('analyze')} className="hover:text-amber-950 hover:underline">Analyze Egg (Part 2)</button>
                <span>•</span>
                <button onClick={() => setActiveTab('leaderboard')} className="hover:text-amber-950 hover:underline">Leaderboard (Part 6)</button>
                <span>•</span>
                <button onClick={() => setActiveTab('game')} className="hover:text-amber-950 hover:underline">Chicken Game (Part 7)</button>
                <span>•</span>
                <button onClick={() => setActiveTab('about')} className="hover:text-amber-950 hover:underline">About UNNIMUTTA</button>
              </div>
              <p className="pt-2 text-amber-800/80">
                © {new Date().getFullYear()} UNNIMUTTA Institute of Advanced Double-Yolk Studies. All rights reserved.
              </p>
              <p className="text-[11px] text-amber-700/60 italic">
                “No actual double-yolk eggs were harmed in this website, except during the opening tennis smash. Important research. Probably.”
              </p>
            </div>
          </footer>
        </div>
      );
    };

    const rootElement = document.getElementById('root');
    if (rootElement) {
      ReactDOM.createRoot(rootElement).render(<App />);
    }
  </script>
</body>
</html>
